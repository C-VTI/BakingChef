# Generates BakingChef.xcodeproj:  xcodegen generate
name: BakingChef

options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    # ⬇︎ Change once to something unique (e.g. ch.<deinname>.bakingchef) – all targets derive from it.
    BASE_BUNDLE_ID: ch.vti.bakingchef
    # ⬇︎ Your "Personal Team" ID (Xcode → Settings → Accounts). Can also be picked in Xcode per target.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  BakingChef:
    type: application
    platform: iOS
    sources:
      - BakingChef
      - Shared/Core
      - Shared/UI
      - Shared/LiveActivity
      - path: Recipes
        type: folder
        buildPhase: resources
    info:
      path: BakingChef/Info.plist
      properties:
        CFBundleDisplayName: BakingChef
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: BakingChefWidget
      - target: BakingChefWatch

  BakingChefWidget:
    type: app-extension
    platform: iOS
    sources:
      - BakingChefWidget
      - Shared/LiveActivity
    info:
      path: BakingChefWidget/Info.plist
      properties:
        CFBundleDisplayName: BakingChef
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1"

  BakingChefWatch:
    type: application
    platform: watchOS
    sources:
      - BakingChefWatch
      - Shared/Core
      - Shared/UI
    info:
      path: BakingChefWatch/Info.plist
      properties:
        CFBundleDisplayName: BakingChef
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BASE_BUNDLE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).watchkitapp
